<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adrobot · Кампании</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body><header><strong>Adrobot</strong><span>Keitaro / Кампании</span></header>
<main><h1>Кампании</h1><nav aria-label="Режим работы"><button id="tab-edit" aria-pressed="true">Редактор</button><button id="tab-create" aria-pressed="false">Новая кампания</button></nav>
<p id="status" role="status" aria-live="polite"></p>
<section id="editor"><form id="open-form" class="bar"><label>ID кампании<input name="cid" type="number" min="1" required placeholder="Например, 1024"></label><button class="primary">Открыть</button></form>
<div id="workspace" hidden><div class="heading"><h2 id="campaign-title"></h2><button id="fetch">Загрузить из Keitaro</button></div><div id="streams"></div></div></section>
<section id="creator" hidden><h2>Новая кампания</h2><form id="create-form" class="grid">
<label>Название<input name="name" required maxlength="180" placeholder="campaign1"></label>
<label>Страна · ISO-код<input name="country" pattern="[a-zA-Z]{2}" maxlength="2" required placeholder="AU"></label>
<label>ID оффера<input name="offer_id" type="number" min="1" required></label>
<label>Домен<select name="domain_id" required></select></label>
<label>Группа<select name="group_id" required></select></label>
<label>Источник<select name="traffic_source_id" required></select></label>
<div><button class="primary">Создать кампанию</button></div></form></section></main></body></html>
